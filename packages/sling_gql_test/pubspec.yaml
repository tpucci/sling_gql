name: sling_gql_test
description: >-
  Test helpers for sling_gql: an in-memory GraphQL server that answers the
  client's own documents from plain Dart data, and pumpUntilSettled for widget
  tests.
version: 1.0.0
repository: https://github.com/tpucci/sling_gql
homepage: https://tpucci.github.io/sling_gql/
issue_tracker: https://github.com/tpucci/sling_gql/issues
topics:
  - graphql
  - testing
  - mock

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  sling_gql: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
