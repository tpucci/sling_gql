name: sling_gql
description: GraphQL client for Flutter where the widget is the query — read a field, get the query.
version: 1.0.0
repository: https://github.com/tpucci/sling_gql
homepage: https://tpucci.github.io/sling_gql/
issue_tracker: https://github.com/tpucci/sling_gql/issues
topics:
  - graphql
  - client
  - cache
  - codegen

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
