name: sling_gql_sqflite
description: >-
  Persist sling_gql's normalized cache in SQLite with sqflite: a bounded
  write-behind copy saved as deltas and loaded before the client starts.
version: 0.1.0
repository: https://github.com/tpucci/sling_gql
homepage: https://tpucci.github.io/sling_gql/guides/persistence/
issue_tracker: https://github.com/tpucci/sling_gql/issues
topics:
  - graphql
  - sqflite
  - cache
  - persistence

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sling_gql: ^0.2.2
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sling_gql_test: ^0.1.1+2
  sqflite_common_ffi: ^2.4.0
