name: sling_gql_hooks
description: >-
  flutter_hooks adapter for sling_gql: useSlingQuery, useSlingMutation and
  useSlingSubscription, the QueryBuilder / MutationBuilder /
  SubscriptionBuilder of a HookWidget.
version: 1.0.0
repository: https://github.com/tpucci/sling_gql
homepage: https://tpucci.github.io/sling_gql/
issue_tracker: https://github.com/tpucci/sling_gql/issues
topics:
  - graphql
  - hooks
  - flutter-hooks

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  sling_gql: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sling_gql_test: ^1.0.0
