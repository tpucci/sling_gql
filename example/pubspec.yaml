name: sling_gql_example
description: "sling_gql example — SpaceX GraphQL, iOS and web."
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  sling_gql:
    path: ../packages/sling_gql
  sling_gql_sqflite:
    path: ../packages/sling_gql_sqflite
  sqflite: ^2.4.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sling_gql_test:
    path: ../packages/sling_gql_test

flutter:
  uses-material-design: true
  fonts:
    # The network log's documents (a bundled font: the web build has no
    # system monospace). SIL Open Font License, see assets/fonts.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
