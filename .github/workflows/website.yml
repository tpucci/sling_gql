name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The Try-it page embeds the example's web build.
      - 'example/**'
      - 'mock-api/**'
      - 'packages/sling_gql/**'
      - 'scripts/build-web-demo.mjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        run: |
          echo "flutter=$(awk '/^flutter/ {print $2}' .tool-versions | sed 's/-stable$//')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            mock-api/package-lock.json

      # The example's web build with the in-browser mock API, copied to
      # website/public/demo/ (served at /sling_gql/demo/, embedded by Try it).
      - name: Build the web demo (Try it live)
        run: |
          flutter pub get
          node scripts/build-web-demo.mjs

      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
