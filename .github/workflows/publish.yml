name: Publish to pub.dev

# `melos version` tags each bumped package as `<package>-vX.Y.Z`; pushing such
# a tag publishes that package. pub.dev "Automated publishing" is enabled for
# tpucci/sling_gql with tag patterns `sling_gql-v{{version}}`,
# `sling_gql_gen-v{{version}}` and `sling_gql_test-v{{version}}`; auth is the
# GitHub OIDC token, no secrets. `sling_gql_hooks-v{{version}}` and
# `sling_gql_link-v{{version}}` are listed below but must be enabled on pub.dev
# after each package's first (manual) publish.
#
# Release flow (see AGENTS.md "Publishing"):
#   melos version            # conventional commits → bump + CHANGELOG + commit + tags
#   git push --follow-tags

on:
  push:
    tags:
      - 'sling_gql-v[0-9]+.[0-9]+.[0-9]+*'
      - 'sling_gql_gen-v[0-9]+.[0-9]+.[0-9]+*'
      - 'sling_gql_test-v[0-9]+.[0-9]+.[0-9]+*'
      - 'sling_gql_hooks-v[0-9]+.[0-9]+.[0-9]+*'
      - 'sling_gql_link-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write # pub.dev OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package and version from the tag
        id: tag
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          actual=$(awk '/^version:/ {print $2}' "packages/$package/pubspec.yaml")
          if [ "$actual" != "$version" ]; then
            echo "::error::packages/$package is $actual but tag says $version"; exit 1
          fi
          echo "flutter=$(awk '/^flutter/ {print $2}' .tool-versions | sed 's/-stable$//')" >> "$GITHUB_OUTPUT"

      # Requests the pub.dev OIDC token and stores it in the shared pub token
      # store (~/.config/dart/pub-tokens.json). Runs *before* flutter-action so
      # Flutter's `dart` ends up first on PATH — sling_gql depends on the
      # Flutter SDK and cannot be published with a standalone Dart.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.tag.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Publish ${{ steps.tag.outputs.package }} ${{ steps.tag.outputs.version }}
        working-directory: packages/${{ steps.tag.outputs.package }}
        run: dart pub publish --force
