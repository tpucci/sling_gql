name: sling_gql_workspace
description: Pub workspace for the sling_gql monorepo (runtime, generator, test helpers, hooks, gql_link and sqflite adapters, example).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/sling_gql
  - packages/sling_gql_gen
  - packages/sling_gql_test
  - packages/sling_gql_hooks
  - packages/sling_gql_link
  - packages/sling_gql_sqflite
  - example

dev_dependencies:
  melos: ^7.4.0

melos:
  repository: https://github.com/tpucci/sling_gql

  ignore:
    - sling_gql_workspace

  command:
    # `melos version`: Conventional Commits since each package's last
    # `<pkg>-vX.Y.Z` tag -> bump + CHANGELOG.md + one commit + per-package
    # tags. Pushing those tags triggers .github/workflows/publish.yml.
    version:
      branch: main
      linkToCommits: true
      workspaceChangelog: false
      updateGitTagRefs: true
      message: |
        chore(release): publish packages

        {new_package_versions}
      changelogCommitBodies:
        include: false
    publish:
      hooks:
        pre: melos run test:packages

  scripts:
    analyze:
      description: dart analyze every package.
      run: dart analyze --fatal-infos .
      exec:
        concurrency: 1
      packageFilters:
        ignore: [sling_gql_workspace]

    format:
      description: Check formatting in every package.
      run: dart format --output=none --set-exit-if-changed .
      exec:
        concurrency: 1
      packageFilters:
        ignore: [sling_gql_workspace]

    test:runtime:
      description: Runtime, test-helper, hooks, gql_link and sqflite adapter package tests.
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        scope: [sling_gql, sling_gql_test, sling_gql_hooks, sling_gql_link, sling_gql_sqflite]

    test:gen:
      description: Generator package tests.
      run: dart test
      exec:
        concurrency: 1
      packageFilters:
        scope: sling_gql_gen

    test:packages:
      description: Runtime + generator tests (no mock server needed).
      run: melos run test:runtime && melos run test:gen

    test:example:
      description: Example widget tests; starts the mock server for the run.
      run: node $MELOS_ROOT_PATH/scripts/with-mock-api.mjs flutter test
      exec:
        concurrency: 1
      packageFilters:
        scope: sling_gql_example

    test:example:graphql-http:
      description: >-
        The example's end-to-end tests (app flows + graphql_server_test)
        against the mock API's schema and resolvers behind graphql-http +
        graphql-sse (port 4001) instead of yoga.
      run: >-
        node $MELOS_ROOT_PATH/scripts/with-mock-api.mjs
        --server graphql-http-server.mjs --port 4001
        flutter test --dart-define=SLING_API=http://localhost:4001/graphql
        test/app_test.dart test/graphql_server_test.dart
      exec:
        concurrency: 1
      packageFilters:
        scope: sling_gql_example

    build:web:
      description: >-
        Web build of the example with the in-browser mock API, copied to
        website/public/demo/ (the site's Try-it page).
      run: node scripts/build-web-demo.mjs

    test:website:
      description: Build the docs site.
      run: cd website && npm ci --no-audit --no-fund && npm run build

    test:
      description: >-
        All gates (runtime, generator, example against yoga and against
        graphql-http, website).
      run: >-
        melos run test:runtime &&
        melos run test:gen &&
        melos run test:example &&
        melos run test:example:graphql-http &&
        melos run test:website

    generate:
      description: Regenerate example/lib/generated/schema.dart from the introspection snapshot.
      run: >-
        dart run ../packages/sling_gql_gen/bin/sling_gql_gen.dart
        --schema graphql/schema.json --out lib/generated/schema.dart
        --scalar DateTime=DateTime
      exec:
        concurrency: 1
      packageFilters:
        scope: sling_gql_example

    generate:soak:
      description: >-
        Regenerate packages/sling_gql_sqflite/test/soak/soak_schema.dart (the
        soak tests' large schema) from sling_gql_gen's synthetic introspection.
      run: dart run tool/generate_soak_schema.dart
      exec:
        concurrency: 1
      packageFilters:
        scope: sling_gql_gen

    publish:dry-run:
      description: Dry-run pub.dev publish for the public packages.
      run: melos publish --dry-run --yes
